# Konfigurace nočního spouštěče ops/tick.sh (blok F0-B05).
# Soubor se načítá jako bash (source). Žádné tajné údaje sem nepatří.
# Jinou konfiguraci lze podstrčit proměnnou prostředí TICK_CONF=/cesta/k/souboru (používají testy).

# --- Cesty -------------------------------------------------------------------
PROJECT_DIR=/home/honza/jr-content                       # KÓD/, odtud se spouští PM
KB_DIR=/home/honza/jarvis/knowledge/projects/jr-content  # KB/
WT_ROOT=/home/honza/jr-content-wt                        # worktree bloků: $WT_ROOT/<ID>
STAV_FILE=$KB_DIR/vyvoj/stav.md                          # řádek <!-- tick: aktivni=<ID|-> koder=<A|B|-> -->
PM_PROMPT_FILE=$KB_DIR/vyvoj/prompt-projektovy-manazer.md
PERMIT_FILE=$PROJECT_DIR/ops/povoleni-den                # denní povolení: do=AAAA-MM-DDTHH:MM
LOCK_FILE=$PROJECT_DIR/ops/tick.lock
LOG_DIR=$PROJECT_DIR/ops/logs                            # log: $LOG_DIR/tick-AAAA-MM-DD.log
CODEX_SESSIONS_DIR=$HOME/.codex/sessions                 # odtud se čte usage Codexu

# --- Časové okno (čas Jarvise) ----------------------------------------------
WINDOW_START=21:00     # noční okno začíná
WINDOW_END=07:00       # noční okno končí; v noci se běh PM i Codexu ukončí nejpozději v tuto dobu
LAST_START=06:30       # poslední čas, kdy smí tick v noci něco spustit (od 6:30 nic nového)

# --- Limitní brána (plán 4.4) -----------------------------------------------
RESET_DEADLINE=07:30   # 5h okno se musí obnovit nejpozději v tuto dobu
NEW_WINDOW_HOURS=5     # nově otevřené okno se obnoví za tolik hodin
# Kolik % týdenního limitu Claude musí Honzovi zůstat. Výchozí 20.
# Výjimka P-006 (Honza smí obnovit limit): PM může dočasně nastavit 0, pak vrátit na 20.
MIN_CLAUDE_WEEK_LEFT=20   # výjimka P-006 platí jen do obnovení limitu; v noci držet 20

# --- PM (Claude) -------------------------------------------------------------
CLAUDE_BIN=/home/honza/.local/bin/claude   # plná cesta: plánovač (systemd) nemá ~/.local/bin v PATH
PM_MODEL=claude-opus-5-5
PM_TIMEOUT=14400       # sekund (4 h); v noci se navíc zkrátí do WINDOW_END
# Další argumenty pro claude -p (oprávnění apod., obsah řeší F0-B04). Bash pole, např.:
# Noční PM (F0-B04, P-007): režim auto = o krocích mimo pevná povolení rozhoduje bezpečnostní
# kontrola Claude Code (nejisté kroky zamítne, na nikoho nečeká). Pevná povolení: KÓD/.claude/settings.json.
CLAUDE_EXTRA_ARGS=(--permission-mode auto --effort high
  --add-dir /home/honza/jarvis/knowledge/projects/jr-content --add-dir /home/honza/jr-content-wt)
USAGE_TIMEOUT=90       # sekund na `claude -p "/usage"`

# Rozpoznání, že PM skončil kvůli limitu. Rozšířený regulární výraz (grep -E, bez ohledu
# na velikost písmen), hledá se jen v posledních LIMIT_TAIL_LINES řádcích výstupu PM.
CLAUDE_LIMIT_PATTERNS='usage limit|limit reached|hit your limit|rate limit|out of (extra )?usage|session limit|weekly limit'
LIMIT_TAIL_LINES=15
# Návratové kódy claude, které samy znamenají limit (mezerou oddělené; prázdné = žádné).
CLAUDE_LIMIT_EXIT_CODES=""

# --- Záložní Codex (kodér B) ------------------------------------------------
CODEX_BIN=/home/honza/.local/bin/codex
CODEX_MODEL=gpt-6-astra
CODEX_REASONING=high
CODEX_TIMEOUT=10800    # sekund (3 h); v noci se navíc zkrátí do WINDOW_END
# Výjimka P-005: síť kvůli Dockeru a zápis do gitu projektu.
CODEX_EXTRA_ARGS=(
  -c sandbox_workspace_write.network_access=true
  -c 'sandbox_workspace_write.writable_roots=["/home/honza/jr-content/.git"]'
)
# Zadání záložního Codexu. {ID} a {WT} se nahradí blokem a cestou k jeho worktree.
CODEX_TASK='Pracuješ na bloku {ID} projektu JR Content ve worktree {WT}. Nejdřív přečti /home/honza/jr-content/AGENTS.md a /home/honza/jarvis/knowledge/projects/jr-content/vyvoj/bloky/{ID}.md (včetně průběhu, možná navazuješ na někoho jiného) a postupuj podle nich. Jsi záložní kodér B spuštěný automaticky nočním spouštěčem, protože projektový manažer (Claude) teď běžet nemůže. Smíš jen dokončovat tento aktivní blok. Nesmíš plánovat, zadávat nové bloky, mergovat ani měnit plán, stav.md nebo jiné soubory v KB kromě souboru tohoto bloku. Sestavení, testy a aplikaci spouštěj jen uvnitř vývojového prostředí v Dockeru (příkazy make podle /home/honza/jarvis/knowledge/projects/jr-content/aplikace/provoz/vyvojove-prostredi.md). Na konci zapiš do sekce 2 bloku shrnutí (nebo Přerušeno: kde jsi a co dál) a commitni do větve blok/{ID}.'
