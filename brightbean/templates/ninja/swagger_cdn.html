{% load static %}
{% comment %}JR Content: upraveno 2026-10-23 (blok F2-B10), AGPL-3.0.{% endcomment %}
<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="{% static 'vendor/swagger-ui-dist/swagger-ui.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/jrc-logo.svg' %}">
    <title>{{ api.title }}</title>
</head>
<body>
    <div id="swagger-ui">
    </div>

    <script src="{% static 'vendor/swagger-ui-dist/swagger-ui-bundle.js' %}"></script>
    <script type="application/json" id="swagger-settings" nonce="{{ request.csp_nonce }}">
        {{ swagger_settings | safe }}
    </script>
    <script nonce="{{ request.csp_nonce }}">

        const configJson = document.getElementById("swagger-settings").textContent;
        const configObject = JSON.parse(configJson);

        configObject.validatorUrl = null;
        configObject.dom_id = "#swagger-ui";
        configObject.presets = [
            SwaggerUIBundle.presets.apis,
            SwaggerUIBundle.SwaggerUIStandalonePreset
        ];
    {% if add_csrf %}
        configObject.requestInterceptor = (req) => {
            req.headers['X-CSRFToken'] = "{{csrf_token}}";
            return req;
        };
    {% endif %}

        const ui = SwaggerUIBundle(configObject);

    </script>
</body>
</html>
