{% extends "base.html" %}
{% block title %}{{ heading }} · JR Content{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl px-4 py-12" data-rejected-page="{{ status }}">
    <h1 class="text-2xl font-semibold text-stone-900">{{ heading }}</h1>
    {% if text %}<p class="mt-4 text-stone-600" role="alert">{{ text }}</p>{% endif %}
    <a href="{% url 'jrc_production:board' %}" class="mt-6 inline-block font-medium text-orange-700 underline">Back to content board</a>
</section>
{% endblock %}
