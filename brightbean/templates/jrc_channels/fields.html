{{ form.non_field_errors }}
<div class="profile-fields">
    {% for field in form %}
    <div class="profile-field">
        {{ field.label_tag }}
        {{ field }}
        <div role="alert">{{ field.errors }}</div>
        {% if field.name == 'profile_url' %}<p class="profile-help">Paste a full profile link, starting with https://.</p>{% endif %}
    </div>
    {% endfor %}
</div>
