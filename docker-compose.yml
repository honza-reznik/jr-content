name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}
x-offline: &offline
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
x-bb: &bb
  build:
    context: ./brightbean
  # Helper editoru žije v obrazu mimo bind mount; obraz musí patřit tomuto projektu.
  image: jrc-bb:${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make}
  restart: unless-stopped
  init: true
  user: "${JRC_UID:-1000}:${JRC_GID:-1000}"
  environment: &bb-environment
    <<: *offline
    DJANGO_SETTINGS_MODULE: config.settings.jrc
    SECRET_KEY: ${JRC_BB_SECRET_KEY:?Spusťte make env}
    ENCRYPTION_KEY_SALT: ${JRC_BB_ENCRYPTION_KEY_SALT:?Spusťte make env}
    DB_HOST: jrc-postgres
    DB_PORT: 5432
    DB_USER: ${PGUSER:-jrc}
    DB_PASSWORD: ${PGPASSWORD:?Spusťte make env}
    EMAIL_BACKEND_TYPE: console
    MEDIA_ROOT: /app/media
    APP_URL: http://127.0.0.1:${JRC_APP_PORT:-13000}
    JRC_FF_SYNC_EMAIL: ${JRC_FF_SYNC_EMAIL:-jrc-sync@example.com}
    JRC_FF_SYNC_PASSWORD: ${JRC_FF_SYNC_PASSWORD:?Spusťte make env}
  volumes:
    - ./brightbean:/app
    - jrc-bb-media:/app/media
  networks:
    - internal
  depends_on:
    jrc-bb-migrate:
      condition: service_completed_successfully

x-ff: &ff
  build:
    context: .
    dockerfile: docker/Dockerfile.ff-api
  image: jrc-ff-api:local
  restart: unless-stopped
  init: true
  user: "${JRC_UID:-1000}:${JRC_GID:-1000}"
  working_dir: /workspace
  environment: &ff-environment
    <<: *offline
    DATABASE_URL: postgresql://${PGUSER:-jrc}:${PGPASSWORD:?Spusťte make env}@jrc-postgres:5432/freeframe
    REDIS_URL: redis://jrc-redis:6379/0
    JWT_SECRET: ${JRC_FF_JWT_SECRET:?Spusťte make env}
    JRC_FF_SYNC_EMAIL: ${JRC_FF_SYNC_EMAIL:-jrc-sync@example.com}
    JRC_FF_SYNC_PASSWORD: ${JRC_FF_SYNC_PASSWORD:?Spusťte make env}
    S3_STORAGE: minio
    S3_ENDPOINT: http://jrc-s3:3900
    S3_PUBLIC_ENDPOINT: http://127.0.0.1:${JRC_S3_PORT:-13900}
    S3_ACCESS_KEY: ${JRC_FF_S3_ACCESS_KEY:?Spusťte make env}
    S3_SECRET_KEY: ${JRC_FF_S3_SECRET_KEY:?Spusťte make env}
    S3_BUCKET: jrc-video
    S3_REGION: garage
    AWS_EC2_METADATA_DISABLED: "true"
    FRONTEND_URL: http://127.0.0.1:${JRC_APP_PORT:-13000}/video
    CORS_ALLOW_ORIGINS: http://127.0.0.1:${JRC_APP_PORT:-13000}
    # /docs, /redoc a /openapi.json by byly veřejné bez přihlášení.
    DISABLE_DOCS: "true"
    MAIL_PROVIDER: smtp
    SMTP_HOST: 127.0.0.1
    SMTP_PORT: 9
    SMTP_USE_TLS: "false"
    TRANSCODING_CONCURRENCY: 1
    TRANSCODER_CPU_LIMIT: 4
    STALE_UPLOAD_TIMEOUT_HOURS: 24
    SOFT_DELETE_RETENTION_DAYS: 30
    ORPHAN_SWEEP_GRACE_HOURS: 0
  volumes:
    - ./freeframe:/workspace
    - ./scripts:/jrc-scripts:ro
  networks:
    - internal
  depends_on:
    jrc-ff-migrate:
      condition: service_completed_successfully
    jrc-redis:
      condition: service_healthy
    jrc-s3:
      condition: service_healthy

services:
  # Společný webový vstup. Aplikace samotné zůstávají bez cesty na internet.
  jrc-proxy:
    build:
      context: docker
      dockerfile: Dockerfile.ingress
    image: jrc-ingress:local
    restart: unless-stopped
    # Vstupní proces nejprve odstraní trasy a pak exec jako UID/GID bez capabilities.
    user: "0:0"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *offline
      JRC_UID: ${JRC_UID:-1000}
      JRC_GID: ${JRC_GID:-1000}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    # Compose při změně obsahu znovu vytvoří proxy i se souborem nově připojeným.
    labels:
      cz.jr-content.caddyfile-sha256: ${JRC_CADDYFILE_SHA256:-unset}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:uid=${JRC_UID:-1000},gid=${JRC_GID:-1000},mode=0700
      - /config:uid=${JRC_UID:-1000},gid=${JRC_GID:-1000},mode=0700
    networks: [ingress, internal]
    # Docker DNS dál překládá názvy služeb, cizí dotazy nemá kam předat.
    dns: [127.0.0.1]
    ports:
      - "127.0.0.1:${JRC_APP_PORT:-13000}:8080"
    depends_on:
      jrc-bb-web:
        condition: service_healthy
      jrc-ff-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 6s
      retries: 30
  # Brána zůstává jen pro S3: podepsané adresy videí načítá přímo prohlížeč.
  # PostgreSQL je jen ve vnitřní síti (psql přes docker compose exec). Pevný TCP cíl; klient nemůže zadat obecný proxy server.
  jrc-ff-gate:
    build:
      context: docker
      dockerfile: Dockerfile.ingress
    image: jrc-ingress:local
    restart: unless-stopped
    user: "0:0"
    command: ["node", "/gate.cjs"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *offline
      JRC_UID: ${JRC_UID:-1000}
      JRC_GID: ${JRC_GID:-1000}
    volumes:
      - ./scripts/local-gate.cjs:/gate.cjs:ro
    networks: [ingress, internal]
    dns: [127.0.0.1]
    ports:
      - "127.0.0.1:${JRC_S3_PORT:-13900}:13900"
  jrc-ff-db:
    image: postgres:18.6-bookworm
    restart: "no"
    environment:
      <<: *offline
      PGHOST: jrc-postgres
      PGUSER: ${PGUSER:-jrc}
      PGDATABASE: ${PGDATABASE:-jrc}
      PGPASSWORD: ${PGPASSWORD:?Spusťte make env}
    command: ["sh", "/scripts/init-freeframe-db.sh"]
    volumes:
      - ./scripts/init-freeframe-db.sh:/scripts/init-freeframe-db.sh:ro
    networks: [internal]
    depends_on:
      jrc-postgres:
        condition: service_healthy
  jrc-ff-migrate:
    <<: *ff
    restart: "no"
    command: ["sh", "-c", "cd apps/api && alembic upgrade head && cd /workspace && PYTHONPATH=/workspace python /jrc-scripts/init-freeframe-account.py"]
    depends_on:
      jrc-ff-db:
        condition: service_completed_successfully
  jrc-ff-api:
    <<: *ff
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/video-api"]
    environment:
      <<: *ff-environment
      # F5-B02: klíč vstupenek jen pro API (ověřuje), workery ho nedostávají.
      JRC_FF_SSO_SECRET: ${JRC_FF_SSO_SECRET:?Spusťte make env}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 30
  jrc-ff-worker:
    <<: *ff
    command: ["celery", "-A", "apps.api.tasks.celery_app", "worker", "-Q", "transcoding", "-c", "1", "--loglevel=info"]
  jrc-ff-maintenance:
    <<: *ff
    command: ["celery", "-A", "apps.api.tasks.celery_app", "worker", "-Q", "maintenance", "-c", "1", "--loglevel=info"]
  jrc-ff-beat:
    <<: *ff
    # Pevný název zabraňuje škálování na více instancí plánovače.
    container_name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-ff-beat
    command: ["celery", "-A", "apps.api.tasks.celery_app", "beat", "-s", "/tmp/celerybeat-schedule", "--loglevel=info"]
  jrc-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment: *offline
    # F5-B02: použitá vstupenka (nonce) musí přežít i pád stroje; zápis na disk při každém příkazu.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    networks: [internal]
    volumes:
      - jrc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  jrc-ff-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.ff-web
    image: jrc-ff-web:local
    restart: unless-stopped
    init: true
    user: "${JRC_UID:-1000}:${JRC_GID:-1000}"
    working_dir: /app
    environment:
      <<: *offline
      NEXT_PUBLIC_BASE_PATH: /video
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${JRC_APP_PORT:-13000}/video-api
      API_INTERNAL_URL: http://jrc-ff-api:8000
    command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0"]
    volumes:
      - ./freeframe/apps/web:/app
      - jrc-ff-web-modules:/app/node_modules
      - jrc-ff-web-next:/app/.next
      - ./scripts:/jrc-scripts:ro
    networks: [internal]
    depends_on:
      jrc-ff-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/video/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 20s
      retries: 30
  jrc-bb-db:
    image: postgres:18.6-bookworm
    restart: "no"
    environment:
      <<: *offline
      PGHOST: jrc-postgres
      PGUSER: ${PGUSER:-jrc}
      PGDATABASE: ${PGDATABASE:-jrc}
      PGPASSWORD: ${PGPASSWORD:?Spusťte make env}
    command: ["sh", "/scripts/init-brightbean-db.sh"]
    volumes:
      - ./scripts/init-brightbean-db.sh:/scripts/init-brightbean-db.sh:ro
    networks:
      - internal
    depends_on:
      jrc-postgres:
        condition: service_healthy
  jrc-bb-migrate:
    <<: *bb
    restart: "no"
    # Nový svazek médií je nejprve nutné předat běžnému uživateli aplikace.
    user: "0:0"
    command: ["sh", "-c", "chown $${JRC_UID}:$${JRC_GID} /app/media && exec setpriv --reuid=$${JRC_UID} --regid=$${JRC_GID} --clear-groups python manage.py migrate --noinput"]
    environment:
      <<: *offline
      DJANGO_SETTINGS_MODULE: config.settings.jrc
      SECRET_KEY: ${JRC_BB_SECRET_KEY:?Spusťte make env}
      ENCRYPTION_KEY_SALT: ${JRC_BB_ENCRYPTION_KEY_SALT:?Spusťte make env}
      DB_HOST: jrc-postgres
      DB_PORT: 5432
      DB_USER: ${PGUSER:-jrc}
      DB_PASSWORD: ${PGPASSWORD:?Spusťte make env}
      JRC_UID: ${JRC_UID:-1000}
      JRC_GID: ${JRC_GID:-1000}
    depends_on:
      jrc-bb-db:
        condition: service_completed_successfully
  jrc-bb-web:
    <<: *bb
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      <<: *bb-environment
      # F5-B02: klíč vstupenek jen pro web Brightbean (vydává), worker ho nedostává.
      JRC_FF_SSO_SECRET: ${JRC_FF_SSO_SECRET:?Spusťte make env}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)) == {'status': 'ok'}"]
      interval: 3s
      timeout: 6s
      retries: 30
  jrc-bb-worker:
    <<: *bb
    command: ["python", "manage.py", "run_studio_worker"]
  jrc-dev:
    image: jrc-dev:local
    container_name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-dev
    restart: unless-stopped
    init: true
    user: "${JRC_UID:-1000}:${JRC_GID:-1000}"
    environment:
      <<: *offline
      HOME: /tmp/jrc-home
      PGHOST: jrc-postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-jrc}
      PGDATABASE: ${PGDATABASE:-jrc}
      PGPASSWORD: ${PGPASSWORD:?Spusťte make env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Spusťte make env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Spusťte make env}
      S3_BUCKET: ${S3_BUCKET:-jrc-local}
      S3_ENDPOINT_URL: http://jrc-s3:3900
      AWS_DEFAULT_REGION: garage
      AWS_EC2_METADATA_DISABLED: "true"
    working_dir: /workspace
    command: ["sh", "-c", "mkdir -p /tmp/jrc-home && exec sleep infinity"]
    volumes:
      - .:/workspace
    networks: [internal]
    shm_size: 1gb
    depends_on:
      jrc-postgres:
        condition: service_healthy
      jrc-s3:
        condition: service_healthy
  jrc-postgres:
    networks: [internal]
    image: postgres:18.6-bookworm
    container_name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-postgres
    restart: unless-stopped
    environment:
      <<: *offline
      POSTGRES_USER: ${PGUSER:-jrc}
      POSTGRES_DB: ${PGDATABASE:-jrc}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Spusťte make env}
    volumes:
      - jrc-postgres-data:/var/lib/postgresql
    healthcheck:
      # Dočasný server při inicializaci svazku přijímá jen unixový socket, nikoli TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
  jrc-s3:
    networks: [internal]
    build:
      context: docker
      dockerfile: Dockerfile.s3
    image: jrc-s3:local
    container_name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-s3
    restart: unless-stopped
    environment:
      <<: *offline
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Spusťte make env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Spusťte make env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Spusťte make env}
      S3_BUCKET: ${S3_BUCKET:-jrc-local}
      JRC_FF_S3_ACCESS_KEY: ${JRC_FF_S3_ACCESS_KEY:?Spusťte make env}
      JRC_FF_S3_SECRET_KEY: ${JRC_FF_S3_SECRET_KEY:?Spusťte make env}
    volumes:
      - jrc-s3-data:/var/lib/garage
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/garage/meta/.jrc-initialized && test -f /var/lib/garage/meta/.jrc-video-initialized && garage status >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 40
networks:
  internal:
    internal: true
  ingress:
    # Pouze místní vstupní porty. Brány před exec odstraní výchozí trasy;
    # navíc není povolen překlad jejich adres na adresu hostitele.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
volumes:
  jrc-postgres-data:
    name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-postgres-data
  jrc-s3-data:
    name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-s3-data
  jrc-bb-media:
    name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-bb-media
  jrc-redis-data:
    name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-redis-data
  jrc-ff-web-modules:
    name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-ff-web-modules
  jrc-ff-web-next:
    name: ${JRC_PROJECT:?JRC_PROJECT není nastavený, použij make (výchozí jrc) nebo JRC_PROJECT=jrc-<blok>}-ff-web-next
